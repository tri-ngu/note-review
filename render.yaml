databases:
  - name: note-review-db
    plan: free

services:
  - type: web
    name: note-review-backend
    env: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: note-review-db
          property: connectionString
